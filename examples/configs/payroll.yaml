# Payroll example
# Reconciles payroll statements and remittance PDFs to payroll export files

output_root: "~/Statements"
folder_template: "{source}/{source} {date:%Y.%m.%d}"
mail_folders:
  - "Inbox/Payroll"
min_attachment_bytes: 4096
data_extensions: [".csv", ".xlsx"]
sources:
  - name: PAYROLL_PROVIDER
    match:
      subject_all: ["Payroll", "Remittance", "Monthly"]
      attachment_contains: ["payroll_statement", "remittance"]
    document:
      start_markers: ["PAYROLL DETAIL"]
      stop_markers: ["TOTALS"]
      skip_markers: ["Page ", "Employee Summary"]
      columns:
        reference: 50
        date: 110
        description: 200
        amount: 430
    records:
      reference: ["Employee ID", "Emp ID", "Reference"]
      date: ["Date", "Pay Date"]
      description: ["Description", "Pay Type"]
      amount: ["Net Pay", "Amount", "Total"]
    match_key: ["date", "description", "amount"]
