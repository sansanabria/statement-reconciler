# Insurance example
# Reconciles commission or premium statements to internal ledger exports

output_root: "~/Statements"
folder_template: "{source}/{source} {date:%Y.%m.%d}"
mail_folders:
  - "Inbox/Insurance"
min_attachment_bytes: 8192
data_extensions: [".csv", ".xlsx", ".tsv"]
sources:
  - name: INSURANCE_CO
    match:
      subject_all: ["Commission", "Statement", "Insurance"]
      attachment_contains: ["commission_statement", "ins_statement"]
    document:
      start_markers: ["COMMISSIONS"]
      stop_markers: ["END OF COMMISSIONS"]
      skip_markers: ["Page ", "Totals"]
      columns:
        reference: 40
        date: 120
        description: 190
        amount: 430
    records:
      reference: ["Policy No", "Policy", "Reference"]
      date: ["Date", "Transaction Date"]
      description: ["Description", "Policy Holder"]
      amount: ["Commission", "Amount"]
    match_on: reference
