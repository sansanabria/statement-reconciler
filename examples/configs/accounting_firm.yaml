# Accounting / Bookkeeping example
# Reconciles client supplier statements or vendor statements to bookkeeping exports

output_root: "~/Statements"
folder_template: "{source}/{source} {date:%Y.%m.%d}"
mail_folders:
  - "Inbox/Client Statements"
min_attachment_bytes: 8192
data_extensions: [".csv", ".xlsx", ".xlsm", ".tsv"]
sources:
  - name: CLIENT_SUPPLIER
    match:
      subject_all: ["Supplier", "Statement", "ClientA"]
      attachment_contains: ["supplier_statement", "statement_clienta"]
    document:
      start_markers: ["TRANSACTION DETAILS", "INVOICE LIST"]
      stop_markers: ["TOTAL", "END OF STATEMENT"]
      skip_markers: ["Page ", "Continued"]
      columns:
        reference: 50
        date: 120
        description: 200
        amount: 450
    records:
      reference: ["Invoice No", "Invoice", "Inv #", "Reference"]
      date: ["Date", "Invoice Date"]
      description: ["Description", "Details"]
      amount: ["Amount", "Total"]
    match_on: reference
