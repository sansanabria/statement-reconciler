# Ecommerce / Payment processor example
# Reconciles settlement PDFs (fees/settlements) to exported CSVs from processors

output_root: "~/Statements"
folder_template: "{source}/{source} {date:%Y.%m.%d}"
mail_folders:
  - "Inbox/Processor"
min_attachment_bytes: 4096
data_extensions: [".csv", ".xlsx", ".tsv"]
sources:
  - name: PROCESSOR_X
    match:
      subject_all: ["Settlement", "Statement", "ProcessorX"]
      attachment_contains: ["settlement", "processorx_statement"]
    document:
      start_markers: ["SETTLEMENT SUMMARY"]
      stop_markers: ["END OF REPORT"]
      skip_markers: ["Page ", "Summary"]
      columns:
        reference: 60
        date: 130
        description: 220
        amount: 480
    records:
      reference: ["Settlement ID", "ID", "Reference"]
      date: ["Date", "Settlement Date"]
      description: ["Description", "Activity"]
      amount: ["Net Amount", "Amount", "Total"]
    match_on: reference
