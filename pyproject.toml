[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statement-reconciler"
version = "0.1.0"
description = "Pull statement attachments from Outlook, file them into dated folders, and cross-check a PDF against a spreadsheet."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pdfplumber>=0.11",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "odfpy>=1.4",
    "PyYAML>=6.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "reportlab>=4.0",
    "ruff>=0.6",
    "black>=24.0",
]

[project.scripts]
reconcile = "statement_reconciler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated tests",
    "integration: tests spanning several modules",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
